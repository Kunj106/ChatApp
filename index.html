<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #0a0c10;
      --bg-panel:   #0f1117;
      --bg-card:    #161b24;
      --bg-hover:   #1c2333;
      --accent-a:   #00e5ff;   /* electric cyan */
      --accent-b:   #7c4dff;   /* deep violet */
      --accent-glow: rgba(0,229,255,0.18);
      --text-hi:    #e8eaf6;
      --text-mid:   #8892a4;
      --text-lo:    #3d4557;
      --border:     rgba(255,255,255,0.06);
      --radius:     14px;
      --font-head:  'Syne', sans-serif;
      --font-mono:  'Space Mono', monospace;
    }

    html, body { height: 100%; background: var(--bg-deep); color: var(--text-hi); font-family: var(--font-mono); overflow: hidden; }

    /* === NOISE TEXTURE === */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 180px;
      opacity: 0.4;
    }

    /* AMBIENT GLOW BLOBS */
    .glow-blob {
      position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0;
    }
    .glow-blob.a { width: 360px; height: 360px; background: rgba(124,77,255,0.12); top: -80px; left: -80px; }
    .glow-blob.b { width: 280px; height: 280px; background: rgba(0,229,255,0.09); bottom: 40px; right: -60px; }

    /* === LAYOUT === */
    #app {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
    }

    /* === SIDEBAR === */
    #sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
      animation: slideInLeft 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes slideInLeft {
      from { transform: translateX(-30px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    .sidebar-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 10px;
    }
    .logo-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent-b), var(--accent-a));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 0 0 18px rgba(0,229,255,0.25);
    }
    .logo span { background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .sidebar-label {
      font-size: 10px; letter-spacing: 2px; color: var(--text-lo);
      text-transform: uppercase; padding: 20px 24px 10px;
    }

    .room-input-wrap {
      padding: 0 16px 16px;
      display: flex; gap: 8px;
    }
    .room-input-wrap input {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 13px; color: var(--text-hi);
      font-family: var(--font-mono); font-size: 12px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .room-input-wrap input:focus {
      border-color: var(--accent-a);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .room-input-wrap input::placeholder { color: var(--text-lo); }
    .btn-icon {
      background: linear-gradient(135deg, var(--accent-b), var(--accent-a));
      border: none; border-radius: 9px; width: 36px; height: 36px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 12px rgba(0,229,255,0.2);
    }
    .btn-icon:hover { transform: scale(1.07); box-shadow: 0 0 20px rgba(0,229,255,0.35); }
    .btn-icon:active { transform: scale(0.96); }

    #room-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
    #room-list::-webkit-scrollbar { width: 4px; }
    #room-list::-webkit-scrollbar-track { background: transparent; }
    #room-list::-webkit-scrollbar-thumb { background: var(--text-lo); border-radius: 4px; }

    .room-item {
      padding: 11px 14px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: background 0.15s; margin-bottom: 3px;
      animation: fadeUp 0.3s ease both;
    }
    .room-item:hover { background: var(--bg-hover); }
    .room-item.active {
      background: var(--bg-card);
      box-shadow: inset 3px 0 0 var(--accent-a);
    }
    .room-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent-a); box-shadow: 0 0 6px var(--accent-a);
    }
    .room-name { font-size: 13px; color: var(--text-hi); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-badge {
      font-size: 10px; padding: 2px 7px; border-radius: 20px;
      background: rgba(0,229,255,0.12); color: var(--accent-a); font-family: var(--font-mono);
    }

    .sidebar-footer {
      padding: 16px 20px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-b), var(--accent-a));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; font-family: var(--font-head);
      flex-shrink: 0;
    }
    .user-info { flex: 1; }
    .user-name { font-size: 13px; font-weight: 600; font-family: var(--font-head); }
    .user-status { font-size: 10px; color: var(--accent-a); display: flex; align-items: center; gap: 5px; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-a); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* === CHAT PANEL === */
    #chat-panel {
      display: flex; flex-direction: column; background: var(--bg-deep);
      animation: fadeIn 0.5s ease both 0.1s;
    }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

    #chat-header {
      padding: 18px 28px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-panel);
    }
    .chat-room-icon {
      width: 40px; height: 40px; border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-b) 0%, var(--accent-a) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 0 18px rgba(124,77,255,0.3);
    }
    .chat-room-info { flex: 1; }
    .chat-room-name { font-family: var(--font-head); font-size: 16px; font-weight: 700; }
    .chat-room-sub { font-size: 11px; color: var(--text-mid); margin-top: 2px; }

    .header-actions { display: flex; gap: 8px; }
    .hbtn {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 12px; color: var(--text-mid); cursor: pointer; font-size: 13px;
      font-family: var(--font-mono); transition: all 0.15s;
    }
    .hbtn:hover { color: var(--accent-a); border-color: var(--accent-a); background: var(--bg-hover); }

    /* === MESSAGES === */
    #messages {
      flex: 1; overflow-y: auto; padding: 28px;
      display: flex; flex-direction: column; gap: 6px;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--text-lo); border-radius: 4px; }

    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: var(--text-lo); text-align: center;
      animation: fadeIn 0.5s ease;
    }
    .empty-icon { font-size: 48px; opacity: 0.3; }
    .empty-title { font-family: var(--font-head); font-size: 18px; font-weight: 700; color: var(--text-mid); }
    .empty-sub { font-size: 12px; line-height: 1.7; max-width: 260px; }

    /* Date divider */
    .date-divider {
      display: flex; align-items: center; gap: 14px; margin: 16px 0 10px;
    }
    .date-divider::before, .date-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .date-divider span { font-size: 10px; color: var(--text-lo); letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; }

    /* Message bubble */
    .msg-row { display: flex; gap: 10px; align-items: flex-end; animation: fadeUp 0.25s ease both; }
    @keyframes fadeUp { from{transform:translateY(10px);opacity:0;} to{transform:translateY(0);opacity:1;} }
    .msg-row.mine { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent-b), var(--accent-a));
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; font-family: var(--font-head);
      margin-bottom: 2px;
    }
    .msg-row.mine .msg-avatar { background: linear-gradient(135deg, #1a3a4a, #0a5a6a); }

    .msg-body { max-width: 62%; }
    .msg-sender { font-size: 10px; color: var(--text-lo); margin-bottom: 4px; letter-spacing: 0.5px; }
    .msg-row.mine .msg-sender { text-align: right; }

    .msg-bubble {
      padding: 11px 16px; border-radius: 16px 16px 16px 4px;
      background: var(--bg-card); border: 1px solid var(--border);
      font-size: 13px; line-height: 1.6; color: var(--text-hi); word-break: break-word;
      position: relative;
    }
    .msg-row.mine .msg-bubble {
      border-radius: 16px 16px 4px 16px;
      background: linear-gradient(135deg, rgba(124,77,255,0.18), rgba(0,229,255,0.1));
      border-color: rgba(0,229,255,0.2);
    }
    .msg-time { font-size: 9px; color: var(--text-lo); margin-top: 4px; }
    .msg-row.mine .msg-time { text-align: right; }

    /* === INPUT BAR === */
    #input-bar {
      padding: 18px 28px;
      background: var(--bg-panel); border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    #msg-input {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 18px; color: var(--text-hi);
      font-family: var(--font-mono); font-size: 13px; outline: none;
      resize: none; max-height: 120px; line-height: 1.5;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #msg-input:focus {
      border-color: var(--accent-a);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #msg-input::placeholder { color: var(--text-lo); }

    #send-btn {
      background: linear-gradient(135deg, var(--accent-b), var(--accent-a));
      border: none; border-radius: 12px; width: 46px; height: 46px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 20px rgba(0,229,255,0.25);
      flex-shrink: 0;
    }
    #send-btn:hover { transform: scale(1.07); box-shadow: 0 0 30px rgba(0,229,255,0.4); }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* === MODAL === */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .modal {
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 18px; padding: 32px; width: 380px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
      animation: modalIn 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes modalIn { from{transform:scale(0.9) translateY(20px);opacity:0;} to{transform:scale(1) translateY(0);opacity:1;} }
    .modal h2 { font-family: var(--font-head); font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .modal p { font-size: 12px; color: var(--text-mid); margin-bottom: 22px; line-height: 1.6; }
    .modal label { font-size: 11px; color: var(--text-lo); letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 7px; }
    .modal input {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; color: var(--text-hi);
      font-family: var(--font-mono); font-size: 13px; outline: none; margin-bottom: 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .modal input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 3px var(--accent-glow); }
    .modal-actions { display: flex; gap: 10px; }
    .btn-primary {
      flex: 1; background: linear-gradient(135deg, var(--accent-b), var(--accent-a));
      border: none; border-radius: 10px; padding: 12px; color: #fff;
      font-family: var(--font-head); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 20px rgba(0,229,255,0.2);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 28px rgba(0,229,255,0.35); }
    .btn-secondary {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 18px; color: var(--text-mid); font-family: var(--font-mono);
      font-size: 13px; cursor: pointer; transition: all 0.15s;
    }
    .btn-secondary:hover { color: var(--text-hi); border-color: var(--text-lo); }

    /* TOAST */
    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 20px; font-size: 13px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      z-index: 200; transition: all 0.3s; opacity: 0; pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    #toast.success { border-color: var(--accent-a); color: var(--accent-a); }
    #toast.error { border-color: #ff4d6d; color: #ff4d6d; }

    /* NO ROOM SELECTED STATE */
    #no-room {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: var(--text-lo);
    }
    #no-room .big-icon { font-size: 64px; opacity: 0.12; }
    #no-room h2 { font-family: var(--font-head); font-size: 22px; font-weight: 800; color: var(--text-mid); }
    #no-room p { font-size: 13px; color: var(--text-lo); text-align: center; max-width: 260px; line-height: 1.7; }

    /* Typing indicator */
    .typing-dot {
      display: inline-block; width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent-a); margin: 0 2px;
      animation: typingBounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-5px);} }
  </style>
</head>
<body>
<div class="glow-blob a"></div>
<div class="glow-blob b"></div>

<!-- JOIN MODAL -->
<div class="modal-overlay" id="join-modal">
  <div class="modal">
    <h2>⚡ Nexus Chat</h2>
    <p>Enter your username to start chatting in real-time rooms.</p>
    <label>Your Username</label>
    <input id="username-input" type="text" placeholder="e.g. ghostwave" maxlength="20" autofocus />
    <div class="modal-actions">
      <button class="btn-primary" onclick="handleJoin()">Enter Nexus →</button>
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <span>Nexus</span>
      </div>
    </div>

    <div class="sidebar-label">Rooms</div>
    <div class="room-input-wrap">
      <input id="room-name-input" type="text" placeholder="Room name..." maxlength="30" onkeydown="if(event.key==='Enter')createRoom()" />
      <button class="btn-icon" onclick="createRoom()" title="Create or join room">+</button>
    </div>
    <div id="room-list"></div>

    <div class="sidebar-footer">
      <div class="avatar" id="user-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name-display">—</div>
        <div class="user-status"><span class="status-dot"></span> online</div>
      </div>
    </div>
  </aside>

  <!-- CHAT PANEL -->
  <main id="chat-panel">
    <!-- No Room Selected -->
    <div id="no-room">
      <div class="big-icon">💬</div>
      <h2>No Room Selected</h2>
      <p>Create or join a room from the sidebar to start chatting.</p>
    </div>

    <!-- Chat View (hidden initially) -->
    <div id="chat-view" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
      <div id="chat-header">
        <div class="chat-room-icon" id="chat-icon">🌐</div>
        <div class="chat-room-info">
          <div class="chat-room-name" id="chat-room-title">—</div>
          <div class="chat-room-sub" id="chat-room-sub">0 messages · connected</div>
        </div>
        <div class="header-actions">
          <button class="hbtn" onclick="clearChat()">clear</button>
          <button class="hbtn" onclick="leaveRoom()">leave</button>
        </div>
      </div>

      <div id="messages"></div>

      <div id="input-bar">
        <textarea id="msg-input" rows="1" placeholder="Type a message..." onkeydown="handleKey(event)"></textarea>
        <button id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
  // ─── STATE ─────────────────────────────────────────────
  const BASE_URL = 'http://localhost:8080';
  let currentUser = '';
  let currentRoom = null;
  let rooms = {}; // roomId -> { messages: [], memberCount }
  let stompClient = null;
  let subscriptions = {};

  const roomIcons = ['🌐','🔥','💎','🌙','⚡','🎯','🚀','🌊','🎲','🔮'];
  function getRoomIcon(roomId) {
    let h = 0; for (let c of roomId) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
    return roomIcons[Math.abs(h) % roomIcons.length];
  }

  // ─── JOIN ──────────────────────────────────────────────
  function handleJoin() {
    const val = document.getElementById('username-input').value.trim();
    if (!val) { showToast('Enter a username', 'error'); return; }
    currentUser = val;
    document.getElementById('join-modal').style.display = 'none';
    document.getElementById('app').style.display = 'grid';
    document.getElementById('user-name-display').textContent = currentUser;
    document.getElementById('user-avatar').textContent = currentUser[0].toUpperCase();
    initWebSocket();
    loadDemoRooms();
  }

  // ─── WEBSOCKET ────────────────────────────────────────
  function initWebSocket() {
    try {
      const SockJS = window.SockJS || null;
      if (!SockJS) { console.warn('SockJS not loaded — demo mode'); return; }
      const socket = new SockJS(`${BASE_URL}/chat`);
      stompClient = Stomp.over(socket);
      stompClient.debug = null;
      stompClient.connect({}, () => console.log('WS connected'), err => console.warn('WS error', err));
    } catch(e) { console.warn('WebSocket unavailable — demo mode'); }
  }

  function subscribeToRoom(roomId) {
    if (!stompClient || !stompClient.connected) return;
    if (subscriptions[roomId]) return;
    subscriptions[roomId] = stompClient.subscribe(`/topic/room/${roomId}`, (msg) => {
      const message = JSON.parse(msg.body);
      addMessageToRoom(roomId, message, false);
      if (currentRoom === roomId) renderMessages();
    });
  }

  // ─── ROOMS ────────────────────────────────────────────
  function loadDemoRooms() {
    // pre-populate demo rooms for preview
    const demos = ['general','dev-talk','design'];
    demos.forEach(r => {
      rooms[r] = { messages: [], icon: getRoomIcon(r) };
      if (r === 'general') {
        rooms[r].messages = [
          { sender: 'system', content: 'Welcome to #general! 👋', timeStamp: new Date(Date.now()-120000).toISOString(), isSystem: true },
          { sender: 'alice', content: 'Hey everyone, glad to be here!', timeStamp: new Date(Date.now()-90000).toISOString() },
          { sender: 'bob', content: 'What\'s up? 🚀', timeStamp: new Date(Date.now()-60000).toISOString() },
        ];
      }
    });
    renderRoomList();
  }

  async function createRoom() {
    const input = document.getElementById('room-name-input');
    const roomId = input.value.trim().toLowerCase().replace(/\s+/g,'-');
    if (!roomId) return;

    if (rooms[roomId]) { selectRoom(roomId); input.value = ''; return; }

    try {
      const res = await fetch(`${BASE_URL}/api/rooms`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(roomId)
      });
      if (!res.ok && res.status !== 400) throw new Error();
    } catch(e) { /* demo mode — just add locally */ }

    rooms[roomId] = { messages: [
      { sender:'system', content:`Room #${roomId} created!`, timeStamp: new Date().toISOString(), isSystem: true }
    ], icon: getRoomIcon(roomId) };
    renderRoomList();
    selectRoom(roomId);
    input.value = '';
    showToast(`Room #${roomId} created ✓`, 'success');
  }

  function renderRoomList() {
    const list = document.getElementById('room-list');
    list.innerHTML = '';
    Object.keys(rooms).forEach((roomId, i) => {
      const div = document.createElement('div');
      div.className = 'room-item' + (roomId === currentRoom ? ' active' : '');
      div.style.animationDelay = `${i * 0.05}s`;
      const count = rooms[roomId].messages.filter(m=>!m.isSystem).length;
      div.innerHTML = `
        <div class="room-dot"></div>
        <div class="room-name"># ${roomId}</div>
        ${count > 0 ? `<div class="room-badge">${count}</div>` : ''}
      `;
      div.onclick = () => selectRoom(roomId);
      list.appendChild(div);
    });
  }

  function selectRoom(roomId) {
    currentRoom = roomId;
    renderRoomList();
    document.getElementById('no-room').style.display = 'none';
    const cv = document.getElementById('chat-view');
    cv.style.display = 'flex';
    document.getElementById('chat-room-title').textContent = `# ${roomId}`;
    document.getElementById('chat-icon').textContent = rooms[roomId].icon || '🌐';
    subscribeToRoom(roomId);
    renderMessages();
    document.getElementById('msg-input').focus();
  }

  function leaveRoom() {
    currentRoom = null;
    document.getElementById('chat-view').style.display = 'none';
    document.getElementById('no-room').style.display = 'flex';
    renderRoomList();
  }

  function clearChat() {
    if (!currentRoom) return;
    rooms[currentRoom].messages = [];
    renderMessages();
  }

  // ─── MESSAGES ─────────────────────────────────────────
  async function sendMessage() {
    if (!currentRoom) return;
    const input = document.getElementById('msg-input');
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    input.style.height = 'auto';

    const message = { sender: currentUser, content, timeStamp: new Date().toISOString() };

    // Try real API
    try {
      if (stompClient && stompClient.connected) {
        stompClient.send(`/app/sendMessage/${currentRoom}`, {}, JSON.stringify({ sender: currentUser, content, roomId: currentRoom }));
      } else throw new Error('not connected');
    } catch(e) {
      addMessageToRoom(currentRoom, message, true);
      renderMessages();
    }
  }

  function addMessageToRoom(roomId, message, isMine) {
    if (!rooms[roomId]) return;
    message._mine = isMine || message.sender === currentUser;
    rooms[roomId].messages.push(message);
  }

  function renderMessages() {
    const container = document.getElementById('messages');
    const msgs = rooms[currentRoom]?.messages || [];

    document.getElementById('chat-room-sub').textContent =
      `${msgs.filter(m=>!m.isSystem).length} messages · connected`;

    if (!msgs.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-title">Start the conversation</div><div class="empty-sub">Be the first to say something in #${currentRoom}</div></div>`;
      return;
    }

    container.innerHTML = '';
    let lastDate = null;

    msgs.forEach((msg, i) => {
      const d = new Date(msg.timeStamp);
      const dateStr = d.toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'});

      if (dateStr !== lastDate) {
        const div = document.createElement('div');
        div.className = 'date-divider';
        div.innerHTML = `<span>${dateStr}</span>`;
        container.appendChild(div);
        lastDate = dateStr;
      }

      if (msg.isSystem) {
        const div = document.createElement('div');
        div.style.cssText = 'text-align:center;font-size:11px;color:var(--text-lo);margin:4px 0;';
        div.textContent = msg.content;
        container.appendChild(div);
        return;
      }

      const isMine = msg._mine || msg.sender === currentUser;
      const timeStr = d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
      const initials = msg.sender ? msg.sender[0].toUpperCase() : '?';

      const row = document.createElement('div');
      row.className = 'msg-row' + (isMine ? ' mine' : '');
      row.style.animationDelay = `${Math.min(i * 0.03, 0.3)}s`;
      row.innerHTML = `
        <div class="msg-avatar">${initials}</div>
        <div class="msg-body">
          <div class="msg-sender">${msg.sender} · ${timeStr}</div>
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          <div class="msg-time">${timeStr}</div>
        </div>
      `;
      container.appendChild(row);
    });

    container.scrollTop = container.scrollHeight;
  }

  // ─── HELPERS ──────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    // auto-resize textarea
    setTimeout(() => {
      const t = document.getElementById('msg-input');
      t.style.height = 'auto';
      t.style.height = Math.min(t.scrollHeight, 120) + 'px';
    }, 0);
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + type;
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.className = '', 3000);
  }

  // Enter on modal
  document.getElementById('username-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleJoin();
  });
  document.getElementById('room-name-input')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') createRoom();
  });
</script>
</body>
</html>
